apiVersion: apps/v1
kind: Deployment
metadata:
  name: navigation-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navigation
  template:
    metadata:
      labels:
        app: navigation
    spec:
      containers:
        - name: navigation
          image: yourrepo/navigation:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: navigation-service
spec:
  selector:
    app: navigation
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
