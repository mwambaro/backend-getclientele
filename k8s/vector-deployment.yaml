apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      containers:
        - name: vector
          image: yourrepo/vector:latest
          env:
            - name: VECTOR_BACKEND
              value: "faiss"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: vector-service
spec:
  selector:
    app: vector
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
