apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-intent-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-intent
  template:
    metadata:
      labels:
        app: ai-intent
    spec:
      containers:
        - name: ai-intent
          image: yourrepo/ai-intent:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ai-intent-service
spec:
  selector:
    app: ai-intent
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
