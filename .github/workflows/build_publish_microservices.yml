name: Build and Publish Microservices

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [recommender, ai_intent, navigation, vector]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install python deps and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r microservices/${{ matrix.service }}/requirements.txt
          if [ -d "microservices/${{ matrix.service }}" ] && ls microservices/${{ matrix.service }}/*.py | grep -q "test_"; then pytest microservices/${{ matrix.service }} -q || true; fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./microservices/${{ matrix.service }}
          file: ./microservices/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/getclientele-${{ matrix.service }}:latest

  package-helm:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v3
      - name: Package Helm chart
        run: helm package helm -d helm-packages
      - name: Upload Helm package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-packages
          path: helm-packages
