openapi: 3.0.3
info:
  title: GetClientele API
  version: 1.0.0
  description: API spec for GetClientele backend services (auth, vendors, mapping, sessions, AI microservices, payments)
servers:
  - url: http://localhost:8000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      type: oauth2
      flows:
        password:
          tokenUrl: https://auth.getclientele.example.com/oauth/token
          scopes: {}
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        full_name:
          type: string
        nick_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        country:
          type: string
        region:
          type: string
        roles:
          type: array
          items:
            type: string
    SignupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        nick_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        country:
          type: string
        region:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    Product:
      type: object
      properties:
        id:
          type: integer
        vendor:
          type: integer
        product_name:
          type: string
        product_sell_price:
          type: number
          format: double
        product_purchase_price:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Vendor:
      type: object
      properties:
        id:
          type: string
        business_name:
          type: string
        is_mobile:
          type: boolean
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
            address:
              type: string
        categories:
          type: array
          items:
            type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    ShoppingCart:
      type: object
      properties:
        id:
          type: integer
        item_name:
          type: string
        item_price:
          type: number
          format: double
        total_sum_to_pay:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        language:
          type: string
    RecommendationResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              vendor_id:
                type: string
              score:
                type: number
              reason:
                type: string
    Receipt:
      type: object
      properties:
        id:
          type: string
        session:
          type: string
          nullable: true
        vendor:
          type: string
        amount:
          type: number
        commission:
          type: number
        vendor_net:
          type: number
        timestamp:
          type: string
    Payout:
      type: object
      properties:
        id:
          type: string
        vendor:
          type: string
        amount:
          type: number
        currency:
          type: string
        stripe_transfer_id:
          type: string
          nullable: true
        status:
          type: string
        created_at:
          type: string
security:
  - bearerAuth: []
paths:
  /auth/signup/:
    post:
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Created
  /auth/login/:
    post:
      summary: Login and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token response
  /vendors/:
    post:
      summary: Register a vendor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vendor'
      responses:
        '201':
          description: Vendor created
    get:
      summary: List vendors
      parameters:
        - name: market_id
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
      responses:
        '200':
          description: List of vendors
  /vendors/{vendor_id}/:
    get:
      summary: Get vendor by id
      parameters:
        - name: vendor_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vendor object
  /map/trace/start/:
    post:
      summary: Start recording an alley trace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                market_id:
                  type: string
                mapper_id:
                  type: string
      responses:
        '200':
          description: Trace started with trace_id
  /map/trace/stop/{id}/:
    post:
      summary: Stop recording an alley trace and upload points
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                points:
                  type: array
                  items:
                    type: object
                    properties:
                      lat:
                        type: number
                      lng:
                        type: number
                      ts:
                        type: string
      responses:
        '200':
          description: Trace stored

  # AI service endpoints (backend views)
  /ai/intent/:
    post:
      summary: Detect intent from shopper text and extract shopping cart items
      description: Analyzes natural language input to detect shopping intent and extract products/services needed by the shopper. Returns shopping cart items with prices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentRequest'
      responses:
        '200':
          description: Intent detected with shopping cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                  intent:
                    type: object
                    properties:
                      category:
                        type: string
                      price:
                        type: string
                      audience:
                        type: string
                        nullable: true
                  shopping_cart:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShoppingCart'
                  total_sum_to_pay:
                    type: number
                    format: double
  /ai/recommend/:
    post:
      summary: Recommend vendors for a shopper intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent:
                  type: object
                market_id:
                  type: string
                shopper_lat:
                  type: number
                shopper_lng:
                  type: number
      responses:
        '200':
          description: Recommendation response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
  /ai/categorize/:
    post:
      summary: Categorize text into product categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: string
  /ai/rank/:
    post:
      summary: Rank items by score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      vendor_id:
                        type: string
                      score:
                        type: number
      responses:
        '200':
          description: Ranked items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
  /ai/navigation/:
    post:
      summary: Compute a simple route and distance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start:
                  type: object
                destinations:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Route and distance
          content:
            application/json:
              schema:
                type: object
                properties:
                  route:
                    type: array
                    items:
                      type: object
                  distance_m:
                    type: integer
  /ai/forecast/:
    get:
      summary: Forecast expected visitors
      responses:
        '200':
          description: Forecast data
          content:
            application/json:
              schema:
                type: object
                properties:
                  forecast:
                    type: array
                    items:
                      type: object

  /ai/vendor_products/:
    post:
      summary: Extract vendor products and services from natural language input
      description: Parses natural language input to extract products and services for a vendor. Automatically populates the products database table with extracted items. Supports price extraction from text patterns like "Apple $1.50" or "Orange at $2.00".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor_id, text]
              properties:
                vendor_id:
                  type: integer
                  description: The ID of the vendor for which to extract products
                text:
                  type: string
                  description: Natural language text describing products and services. Can include prices like "Apple $1.50, Orange $2.00, Banana $0.75"
      responses:
        '200':
          description: Products extracted and saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                  vendor_id:
                    type: integer
                  products_extracted:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  count:
                    type: integer
                    description: Number of products extracted
        '400':
          description: Missing or invalid vendor_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Vendor not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  # Public API for AI Similar products (compatibility route)
  /api/ai/similar/:
    post:
      summary: Find similar products (calls recommender or vector services)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                products:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                product_id:
                  type: string
                top_k:
                  type: integer
      responses:
        '200':
          description: Similar items (recommender or vector response)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        score:
                          type: number

  # Microservice endpoints (external services) — included for convenience in the UI
  /microservices/vector/index:
    post:
      summary: Index documents into vector service (FAISS/Milvus)
      servers:
        - url: http://localhost:8004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                docs:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
      responses:
        '200':
          description: Inserted count
  /microservices/vector/query:
    post:
      summary: Query vector index
      servers:
        - url: http://localhost:8004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                top_k:
                  type: integer
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        score:
                          type: number
  /microservices/vector/health:
    get:
      summary: Health check for vector microservice
      servers:
        - url: http://localhost:8004
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  backend:
                    type: string